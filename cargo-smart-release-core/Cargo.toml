[package]
name = "cargo-smart-release-core"
version = "0.1.0"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
repository = "https://github.com/GitoxideLabs/cargo-smart-release"
description = "Reusable API compatibility checks for Rust workspaces."
license = "MIT OR Apache-2.0"
edition = "2021"
include = ["src/**/*", "README.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
anyhow = "1.0.103"
cargo_metadata = "0.23.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "log"] }
